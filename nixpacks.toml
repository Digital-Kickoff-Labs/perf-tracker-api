[phases.setup]
nixpkgsArchive = 'fb7f563bfe8c946201d132e50c9b0f526f983890'
nixPkgs = ["nodejs_22","yarn-1_x"]
cmds = ["...", "node -e \"if(process.versions.node !== '22.23.4') throw new Error('Node2Shell: wrong Node runtime')\"", "npm install --prefix /opt/patched-runtime --no-audit --no-fund bun@1.4.4", "test \"$(/opt/patched-runtime/node_modules/.bin/bun --version)\" = \"1.4.4\""]
paths = ["/opt/patched-runtime/node_modules/.bin"]

[variables]
NIXPACKS_NODE_VERSION = "22"
